<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" style="display: block; background: #0c0d14; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141724"/>
      <stop offset="100%" stop-color="#0e101a"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Window Chrome / Frame -->
  <rect x="15" y="15" width="870" height="530" rx="12" fill="url(#cardBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  
  <!-- Browser Header -->
  <rect x="15" y="15" width="870" height="42" rx="12" fill="#181b2a"/>
  <circle cx="38" cy="36" r="5.5" fill="#ef4444"/>
  <circle cx="56" cy="36" r="5.5" fill="#f59e0b"/>
  <circle cx="74" cy="36" r="5.5" fill="#10b981"/>
  <rect x="110" y="26" width="340" height="20" rx="6" fill="rgba(255,255,255,0.05)"/>
  <text x="125" y="40" font-size="11" fill="#94a3b8">electromarjal.com/calculador.html</text>

  <!-- App Header inside page -->
  <text x="50" y="95" font-size="20" font-weight="bold" fill="#ffffff">Asistente de Presupuestos &amp; Ahorro Solar</text>
  <text x="50" y="118" font-size="12" fill="#94a3b8">Simulador técnico de autoconsumo fotovoltaico y amortización económica</text>

  <!-- Step Dots -->
  <g transform="translate(680, 85)">
    <circle cx="0" cy="10" r="10" fill="#10b981"/>
    <text x="0" y="14" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <line x1="12" y1="10" x2="38" y2="10" stroke="#10b981" stroke-width="2"/>
    <circle cx="50" cy="10" r="10" fill="#10b981" filter="url(#glow)"/>
    <text x="50" y="14" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <line x1="62" y1="10" x2="88" y2="10" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <circle cx="100" cy="10" r="10" fill="rgba(255,255,255,0.1)"/>
    <text x="100" y="14" font-size="11" fill="#94a3b8" text-anchor="middle">3</text>
    <line x1="112" y1="10" x2="138" y2="10" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <circle cx="150" cy="10" r="10" fill="rgba(255,255,255,0.1)"/>
    <text x="150" y="14" font-size="11" fill="#94a3b8" text-anchor="middle">4</text>
  </g>

  <!-- Left Column: Interactive Controls -->
  <rect x="50" y="145" width="460" height="365" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)"/>
  
  <text x="75" y="180" font-size="14" font-weight="600" fill="#ffffff">Factura Eléctrica Mensual (€/mes)</text>
  <rect x="75" y="195" width="410" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
  <rect x="75" y="195" width="260" height="8" rx="4" fill="url(#greenGrad)"/>
  <circle cx="335" cy="199" r="9" fill="#ffffff" filter="url(#glow)"/>
  <text x="75" y="222" font-size="12" fill="#64748b">50 €</text>
  <text x="455" y="222" font-size="12" fill="#64748b">350 €</text>
  <text x="320" y="222" font-size="13" font-weight="bold" fill="#34d399">180 € / mes</text>

  <text x="75" y="260" font-size="14" font-weight="600" fill="#ffffff">Espacio Disponible en Cubierta / Tejado</text>
  <g transform="translate(75, 275)">
    <rect x="0" y="0" width="130" height="42" rx="6" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981"/>
    <text x="65" y="25" font-size="12" font-weight="600" fill="#34d399" text-anchor="middle">25-45 m² (Óptimo)</text>

    <rect x="140" y="0" width="130" height="42" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="205" y="25" font-size="12" fill="#94a3b8" text-anchor="middle">&gt; 50 m²</text>

    <rect x="280" y="0" width="130" height="42" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="345" y="25" font-size="12" fill="#94a3b8" text-anchor="middle">Reducido &lt; 20 m²</text>
  </g>

  <text x="75" y="355" font-size="14" font-weight="600" fill="#ffffff">Almacenamiento en Batería</text>
  <g transform="translate(75, 370)">
    <rect x="0" y="0" width="195" height="48" rx="6" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981"/>
    <text x="20" y="24" font-size="13" font-weight="600" fill="#ffffff">Batería Litio 5.1 kWh</text>
    <text x="20" y="39" font-size="11" fill="#34d399">+ Autonomía nocturna</text>
    <circle cx="175" cy="24" r="7" fill="#10b981"/>

    <rect x="210" y="0" width="200" height="48" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="230" y="24" font-size="13" fill="#cbd5e1">Sin Batería</text>
    <text x="230" y="39" font-size="11" fill="#64748b">Inyección directa a red</text>
  </g>

  <!-- Button Next -->
  <rect x="75" y="445" width="410" height="42" rx="6" fill="url(#greenGrad)"/>
  <text x="280" y="471" font-size="14" font-weight="bold" fill="#0c0d14" text-anchor="middle">Ver Estudio de Ahorro y Amortización →</text>

  <!-- Right Column: Real-Time Live Results -->
  <rect x="530" y="145" width="320" height="365" rx="10" fill="#131622" stroke="rgba(52, 211, 153, 0.25)"/>
  
  <text x="555" y="180" font-size="12" font-weight="bold" fill="#10b981" letter-spacing="1">ESTUDIO EN TIEMPO REAL</text>
  <text x="555" y="212" font-size="28" font-weight="800" fill="#ffffff">8 <tspan font-size="16" font-weight="normal" fill="#94a3b8">Paneles (4.4 kWp)</tspan></text>

  <!-- Metric Badges -->
  <g transform="translate(555, 235)">
    <rect x="0" y="0" width="130" height="60" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
    <text x="12" y="22" font-size="10" fill="#94a3b8">AHORRO ESTIMADO</text>
    <text x="12" y="46" font-size="16" font-weight="bold" fill="#34d399">1.420 € <tspan font-size="10" font-weight="normal">/año</tspan></text>

    <rect x="140" y="0" width="130" height="60" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
    <text x="152" y="22" font-size="10" fill="#94a3b8">RETORNO INVERSIÓN</text>
    <text x="152" y="46" font-size="16" font-weight="bold" fill="#c084fc">4.2 <tspan font-size="10" font-weight="normal">Años</tspan></text>
  </g>

  <!-- REBT Standard Tag -->
  <g transform="translate(555, 315)">
    <rect x="0" y="0" width="270" height="42" rx="6" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)"/>
    <text x="14" y="25" font-size="11" fill="#e2e8f0">🛡️ Protecciones REBT ITC-BT-25 y PCS</text>
  </g>

  <!-- Amortization mini-graph preview -->
  <g transform="translate(555, 380)">
    <text x="0" y="0" font-size="10" fill="#64748b">Curva de Generación Solar Diaria (kWh)</text>
    <path d="M 0 65 Q 60 65 100 45 T 140 10 T 180 15 T 220 50 T 270 65" fill="none" stroke="url(#greenGrad)" stroke-width="2.5"/>
    <path d="M 0 65 Q 60 65 100 45 T 140 10 T 180 15 T 220 50 T 270 65 L 270 70 L 0 70 Z" fill="rgba(16, 185, 129, 0.1)"/>
    <line x1="0" y1="70" x2="270" y2="70" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  </g>

  <text x="555" y="490" font-size="10.5" fill="#64748b">Cálculo validado bajo radiación solar de Castellón</text>
</svg>
